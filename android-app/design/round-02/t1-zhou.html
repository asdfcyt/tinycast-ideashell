<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>闪念 · 待办 · 轴</title>
<style>
:root{--orange:#FF5A00;--deep:#C23F00;--cream:#FFF8F0;--brown:#24150C;--brown2:#6B5546;--sans:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;background:var(--cream);overflow:hidden}
body{font-family:var(--sans);color:var(--brown);-webkit-font-smoothing:antialiased}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--cream)}
.status{position:relative;height:32px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.status .ico{display:flex;gap:6px;align-items:center}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.fade{position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(rgba(255,248,240,0),var(--cream) 64%);pointer-events:none}
.dock{position:absolute;left:16px;right:16px;bottom:30px;display:flex;gap:12px;align-items:center}
.nav{flex:1;height:64px;border-radius:32px;background:var(--brown);display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px;align-items:center}
.nav a{height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream);font-size:12px;font-weight:700}
.nav a.on{background:var(--orange);color:var(--brown)}
.fab{position:relative;flex:none;width:64px;height:64px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,90,0,.35)}
.fab .sp{position:absolute;right:-4px;top:-8px;width:20px;height:20px;fill:var(--brown)}
.gesture{position:absolute;left:0;right:0;bottom:0;height:22px}
.gesture::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--brown)}

.head{height:60px;padding:0 12px 0 24px;display:flex;align-items:center;gap:8px}
.head .tt{flex:1}
.head h1{font-size:26px;line-height:30px;font-weight:900;letter-spacing:-.01em}
.head .sub{font-size:13px;line-height:16px;font-weight:600;color:var(--brown2)}
.week{margin:6px 16px 0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{height:70px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.d small{font-size:12px;line-height:16px;font-weight:700;color:var(--brown2)}
.d b{font-size:19px;line-height:24px;font-weight:900;font-variant-numeric:tabular-nums}
.d i{display:flex;gap:3px;height:6px;margin-top:3px}
.d i s{width:5px;height:5px;border-radius:50%;background:var(--orange);display:block}
.d.on{background:var(--brown);color:var(--cream)}
.d.on small{color:rgba(255,248,240,.8)}
.od{margin:12px 16px 0;height:54px;border-radius:27px;background:var(--brown);color:var(--cream);display:flex;align-items:center;padding:0 8px 0 20px;gap:10px}
.od b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.od span{flex:1;font-size:15px;font-weight:700}
.od button{all:unset;height:38px;padding:0 16px;border-radius:19px;background:var(--orange);color:var(--brown);font-size:14px;font-weight:800;display:flex;align-items:center}
.tl{position:relative;margin:14px 16px 0 16px}
.tl::before{content:"";position:absolute;left:56px;top:6px;bottom:0;width:2px;background:rgba(36,21,12,.14)}
.row{position:relative;display:flex;align-items:center;margin-bottom:8px}
.row .tm{width:46px;flex:none;text-align:right;font-size:13px;line-height:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brown2)}
.row .nd{flex:none;width:12px;height:12px;border-radius:50%;background:var(--cream);border:2.5px solid var(--brown);margin:0 12px 0 11px;z-index:1}
.row .nd.hi{border-color:var(--orange)}
.pill{flex:1;min-width:0;height:62px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px 0 12px}
.pill .cb{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--brown)}
.pill .cb.hi{border-color:var(--orange)}
.pill .t{font-size:16px;line-height:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .m{font-size:12.5px;line-height:17px;color:var(--brown2);font-weight:500}
.pill .m em{font-style:normal;color:var(--deep);font-weight:800}
.now{position:relative;display:flex;align-items:center;height:26px;margin-bottom:8px}
.now .tm{width:46px;flex:none;text-align:right;font-size:13px;font-weight:900;color:var(--deep);font-variant-numeric:tabular-nums}
.now .nd{flex:none;width:12px;height:12px;border-radius:50%;background:var(--orange);margin:0 12px 0 11px;z-index:1;box-shadow:0 0 0 4px rgba(255,90,0,.22)}
.now .ln{flex:1;height:2px;background:var(--orange);border-radius:1px}
.dayh{display:flex;align-items:center;margin:16px 0 8px;font-size:15px;font-weight:900}
.dayh span{margin-left:8px;color:var(--brown2);font-size:13px;font-weight:700}
.dayh .rule{flex:1;height:1px;background:rgba(36,21,12,.14);margin-left:12px}
</style>
</head>
<body>
<div class="phone">
<div class="status">
  <span>10:12</span>
  <span class="ico">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#24150C"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#24150C" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="#24150C" stroke="none"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.8" y="0.8" width="21.4" height="10.4" rx="3" stroke="#24150C" stroke-width="1.5"/><rect x="2.6" y="2.6" width="14" height="6.8" rx="1.6" fill="#24150C"/><rect x="23.4" y="4" width="1.8" height="4" rx=".9" fill="#24150C"/></svg>
  </span>
</div>

<div class="head">
  <div class="tt"><h1>待办</h1><div class="sub">10 月 · 本周还有 11 件</div></div>
  <span class="circ" aria-label="搜索"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24150C" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg></span>
  <span class="circ" aria-label="视图与筛选"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24150C" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg></span>
</div>

<div class="week">
  <div class="d on"><small>一</small><b>12</b><i><s></s><s></s><s></s></i></div>
  <div class="d"><small>二</small><b>13</b><i><s></s><s></s></i></div>
  <div class="d"><small>三</small><b>14</b><i><s></s></i></div>
  <div class="d"><small>四</small><b>15</b><i></i></div>
  <div class="d"><small>五</small><b>16</b><i><s></s></i></div>
  <div class="d"><small>六</small><b>17</b><i></i></div>

<div class="tl">
  <div class="now"><span class="tm">10:12</span><i class="nd"></i><span class="ln"></span></div>
  <div class="row"><span class="tm">10:30</span><i class="nd"></i>
    <div class="pill"><i class="cb"></i><div style="min-width:0"><div class="t">和设计师对稿 · 闪念 App 首页</div><div class="m">闪念</div></div></div></div>
  <div class="row"><span class="tm">15:00</span><i class="nd hi"></i>
    <div class="pill"><i class="cb hi"></i><div style="min-width:0"><div class="t">评审 Q4 方案</div><div class="m"><em>重要</em> · 工作</div></div></div></div>
  <div class="row"><span class="tm">20:00</span><i class="nd"></i>

  <div class="row"><span class="tm">全天</span><i class="nd"></i>

  <div class="dayh">明天<span>10月13日 · 2 件</span><i class="rule"></i></div>
  <div class="row"><span class="tm">09:30</span><i class="nd"></i>
    <div class="pill"><i class="cb"></i><div style="min-width:0"><div class="t">周一站会</div><div class="m">工作</div></div></div></div>
</div>
<div class="fade"></div>

<div class="dock">
  <nav class="nav">
    <a><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>今天</a>
    <a class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.2 2.8 2.8 4.8-5.4"/></svg>待办</a>
    <a><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>回看</a>
    <a><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>设置</a>
  </nav>
  <div class="fab">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#24150C" stroke-width="3.2" stroke-linecap="round"><path d="M12 4.5v15M4.5 12h15"/></svg>
    <svg class="sp" viewBox="0 0 24 24"><path d="M12 2c.6 6 4 9.4 10 10-6 .6-9.4 4-10 10-.6-6-4-9.4-10-10 6-.6 9.4-4 10-10Z"/></svg>
  </div>
</div>

</div>
</body>
