<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>闪念 · 今天 · 印</title>
<style>
:root{
  --paper:#F4EFE6;
  --paper-deep:#EBE4D6;
  --ink:#1B1A17;
  --ink-2:#5B564D;
  --line:#D8CFBD;
  --seal:#E04A14;
  --seal-ink:#B53A0A;
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;background:var(--paper);overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--paper)}

/* 状态栏 */
.status{height:32px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.status .ico{display:flex;gap:6px;align-items:center}
.status svg{display:block}

/* 页头：大日期 */
.head{position:relative;padding:14px 24px 0;height:106px}
.head h1{font-family:var(--serif);font-weight:700;font-size:40px;line-height:46px;letter-spacing:-0.01em}
.head h1 small{font-size:18px;font-weight:500;color:var(--ink-2);margin-left:10px;letter-spacing:0}
.head .sum{margin-top:6px;font-size:15px;line-height:22px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.head .sum i{font-style:normal;color:var(--seal-ink);font-weight:600}
.head .sum s{text-decoration:none;margin:0 8px;color:var(--line)}
.search{position:absolute;right:12px;top:10px;width:48px;height:48px;display:flex;align-items:center;justify-content:center}

/* 列表（纸面，没有卡片） */
.sheet{position:absolute;left:0;right:0;top:138px;height:532px;padding:0 24px;overflow:hidden}
.grp{margin-bottom:10px}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;border-top:1.5px solid var(--ink);padding:10px 0 4px;height:40px}
.grp-h b{font-family:var(--serif);font-size:17px;font-weight:700}
.grp-h span{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.row{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);min-height:62px}
.grp .row:last-child{border-bottom:0}
.cb{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);margin-top:2px}
.cb.hi{border:2px solid var(--seal)}
.row .t{font-size:17px;line-height:24px;font-weight:500}
.row .m{margin-top:2px;font-size:13px;line-height:18px;color:var(--ink-2)}
.row .m em{font-style:normal;color:var(--seal-ink);font-weight:600}
.row.done .t{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1px}

/* 印：完成的那一枚 */
.stamp{flex:none;width:24px;height:24px;margin-top:1px;border-radius:3px;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:700;font-size:15px;line-height:24px;text-align:center;transform:rotate(-6deg);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}

/* 底部：刚记下 + 输入条 + 导航 */
.dock{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line)}
.undo{height:34px;padding:0 24px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.undo .k{font-family:var(--serif);font-weight:700;color:var(--seal-ink)}
.undo .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.undo .cd{font-variant-numeric:tabular-nums}
.undo button{all:unset;font-weight:700;color:var(--seal-ink);border-bottom:1px solid var(--seal-ink);line-height:16px}
.cap{margin:8px 16px 10px;height:52px;border-radius:6px;background:var(--paper-deep);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.cap .ph{flex:1;font-size:17px;color:var(--ink-2)}
.cap .go{width:40px;height:40px;border-radius:5px;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center}
.nav{height:46px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;color:var(--ink-2);font-weight:500}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::after{content:"";width:18px;height:2.5px;background:var(--seal);border-radius:1px}
.nav a:not(.on)::after{content:"";width:18px;height:2.5px;background:transparent}
.gesture{height:22px;position:relative}
.gesture::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink)}
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span>09:36</span>
    <span class="ico">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#1B1A17"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#1B1A17" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="#1B1A17" stroke="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.8" y="0.8" width="21.4" height="10.4" rx="3" stroke="#1B1A17" stroke-width="1.4"/><rect x="2.6" y="2.6" width="14" height="6.8" rx="1.6" fill="#1B1A17"/><rect x="23.4" y="4" width="1.8" height="4" rx=".9" fill="#1B1A17"/></svg>
    </span>
  </div>

  <header class="head">
    <h1>10月12日<small>周一</small></h1>
    <p class="sum">今天 4<s>|</s><i>逾期 1</i><s>|</s>已完成 3</p>
    <a class="search" aria-label="搜索">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="1.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
    </a>
  </header>

  <main class="sheet">
    <section class="grp">
      <div class="grp-h"><b>逾期</b><span>1</span></div>
      <div class="row">
        <i class="cb hi"></i>
        <div><div class="t">交周报</div><div class="m"><em>10月9日 周五 15:30</em> · #工作</div></div>
      </div>
    </section>

    <section class="grp">
      <div class="grp-h"><b>今天</b><span>4</span></div>
      <div class="row">
        <i class="cb"></i>
        <div><div class="t">和设计师对稿 · 闪念 App 首页</div><div class="m">10:30 · 闪念 · #设计</div></div>
      </div>
      <div class="row">
        <i class="cb hi"></i>
        <div><div class="t">评审 Q4 方案</div><div class="m">15:00 · <em>重要</em></div></div>
      </div>
      <div class="row">
        <i class="cb"></i>
        <div><div class="t">临《洛神赋》第三段，写 5 遍</div><div class="m">20:00 · 书法 · #练字</div></div>
      </div>
      <div class="row">
        <i class="cb"></i>
        <div><div class="t">给导师回邮件</div><div class="m">全天</div></div>
      </div>
    </section>

    <section class="grp">
      <div class="grp-h"><b>已完成</b><span>3</span></div>
      <div class="row done">
        <i class="stamp">毕</i>
        <div><div class="t">买墨水</div><div class="m">08:12 完成</div></div>
      </div>
    </section>
  </main>

  <footer class="dock">
    <div class="undo">
      <span class="k">日记</span>
      <span class="tx">今天试了新的工作流</span>
      <span class="cd">3 秒后同步</span>
      <button>撤销</button>
    </div>
    <div class="cap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E04A14"><path d="M12 2c.6 6 4 9.4 10 10-6 .6-9.400 4-10 10-.6-6-4-9.400-10-10 6-.6 9.400-4 10-10Z"/></svg>
      <span class="ph">准备做什么？</span>
      <span class="go">记</span>
    </div>
    <nav class="nav">
      <a class="on">今天</a><a>待办</a><a>回看</a><a>设置</a>
    </nav>
    <div class="gesture"></div>
  </footer>
</div>
</body>
</html>
