<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V3 票头黑带加票根</title>
<style>
:root{--bg:#0e0b09;--amber:#ffb14a;--paper:#fcf9f1;--ink:#1f1610;--mute:#6a5e53;--line:#ddd2c0;--deep:#b2441b;--green:#2f8f5b}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:430px;overflow:hidden}
body{font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--ink);position:relative;
 background:radial-gradient(70% 40% at 50% 55%,#3d281b 0,transparent 72%),linear-gradient(#1a1410,#0b0908 75%)}
.mono{font-family:"SF Mono",Menlo,monospace}
.notch{-webkit-mask:radial-gradient(circle at 0 7px,#0000 4px,#000 4.5px) left/51% 14px repeat-y,radial-gradient(circle at 100% 7px,#0000 4px,#000 4.5px) right/51% 14px repeat-y;mask:radial-gradient(circle at 0 7px,#0000 4px,#000 4.5px) left/51% 14px repeat-y,radial-gradient(circle at 100% 7px,#0000 4px,#000 4.5px) right/51% 14px repeat-y}
.led{position:relative;width:max-content;font:900 40px/1 "SF Mono",Menlo,monospace;color:var(--amber);letter-spacing:.04em;text-shadow:0 0 12px #ffa42e88}
.led::after{content:"";position:absolute;inset:-3px;background:radial-gradient(circle,#0000 1.05px,#13100d 1.65px) 0 0/3.4px 3.4px}
.rec{display:flex;align-items:center;gap:9px;background:#f2ecdf;border-radius:9px;padding:8px 11px;margin-bottom:6px;font-size:13px;line-height:1.3}
.rec i{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--green);position:relative}
.rec i::after{content:"";position:absolute;left:3px;top:0;width:3px;height:6px;border:solid var(--green);border-width:0 2px 2px 0;transform:rotate(40deg)}
.rec p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec u{flex:none;text-decoration:none;font-size:11px;font-weight:800;color:#1f6a40;background:#d9efe0;border-radius:5px;padding:2px 6px}
.sec{margin:12px 0 7px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mute)}
.sec::before,.sec::after{content:"";flex:1;border-top:1px solid var(--line)}
.sn{font:600 9.5px/1.4 "SF Mono",Menlo,"PingFang SC",monospace;color:var(--mute);letter-spacing:.01em;white-space:nowrap}
.bars{display:flex}.bars i{display:block;background:var(--ink)}
.stamp{border-radius:50%;border:2.5px solid var(--deep);color:var(--deep);display:grid;place-items:center;text-align:center;font-weight:900;line-height:1.15;transform:rotate(-12deg);position:relative;mix-blend-mode:multiply;flex:none}
.stamp::before{content:"";position:absolute;inset:3.5px;border:1px dashed var(--deep);border-radius:50%}
.stamp small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;margin-top:2px}

body{padding-top:26px}
.ticket{position:relative;margin:0 auto;width:342px;background:linear-gradient(var(--paper),#f6f1e4);border-radius:14px;overflow:hidden;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.band{background:linear-gradient(#211a15,var(--bg));padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #000}
.band .led{font-size:30px}
.band div.r{text-align:right;font-size:12px;line-height:1.65;color:#a89887}
.band b{display:block;color:#6fdc9a;font-weight:700}
.in{padding:13px 20px 14px}
h1{font-size:16px;line-height:1.38;font-weight:900;text-wrap:balance}
.stats{margin-top:10px;display:flex;gap:6px}
.stats span{flex:1;text-align:center;background:#efe8d9;border-radius:9px;padding:6px 0 7px;font-size:11px;color:var(--mute);font-weight:600}
.stats b{display:block;margin-top:2px;font-size:15px;color:var(--ink);font-weight:900}
.stats .c1 b{color:#964b02}.stats .c4 b{color:#3236b0}
.cut{position:relative;border-top:1.5px dashed var(--line);margin-top:6px}
.cut::before,.cut::after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:#150f0b}
.cut::before{left:-28px}.cut::after{right:-28px}
.stub{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 12px}
.stub .bars{height:26px;margin-bottom:5px}
.stamp{width:50px;height:50px;font-size:12px}

</style></head><body>
<main class="ticket">
 <div class="band"><div class="led">30:00</div><div class="r">第 1 个番茄 · 今日累计 30 分<b>● 已完成</b></div></div>
 <div class="in">
  <h1>阅读第二章《像经济学家一样思考》</h1>
  <div class="stats"><span class="c1">时长<b>30 分</b></span><span>番茄<b>第 1 个</b></span><span>记录<b>2 条</b></span><span class="c4">今日累计<b>30 分</b></span></div>
  <div class="sec">期间记录</div><div class="rec"><i></i><p>这个记录到任务中感觉还是可以借用快捷输入，这样可以通过拍照识别来快速输入</p><u>快记</u></div><div class="rec"><i></i><p>在快速输入中也可以增加一个追加的按钮，放在模板按钮的右侧，可以快速追加</p><u>快记</u></div>
 </div>
 <div class="cut"></div>
 <div class="stub"><div><div class="bars" data-w="168"></div><div class="sn">◆ 拾忆 · 已完成任务 · 10-16 10:46 · 3FEEC4 ◆</div></div></div>
 <div class="stamp" style="position:absolute;right:18px;bottom:34px"><div>已完成<small>10·16</small></div></div>
</main>
<script>
let s=3;function r(){s=(s*9301+49297)%233280;return s/233280}
document.querySelectorAll('.bars').forEach(b=>{const W=+b.dataset.w;let x=0;while(x<W){const k=1+Math.floor(r()*3);const g=1+Math.floor(r()*2.4);b.insertAdjacentHTML('beforeend','<i style="width:'+k+'px"></i><i style="width:'+g+'px;background:transparent"></i>');x+=k+g}});
</script></body></html>
