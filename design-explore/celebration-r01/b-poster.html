<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B 成果海报</title>
<style>
:root{--bg:#22150e;--bg2:#33201440;--cream:#f8efe3;--mute:#b9a591;--orange:#f2793f;--line:#ffffff1f}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:640px;overflow:hidden}
body{background:radial-gradient(90% 55% at 80% 0%,#5a3220 0,transparent 70%),var(--bg);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--cream);padding:34px 30px 28px;display:flex;flex-direction:column;position:relative}
.head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--mute)}
.head b{color:var(--orange)}
.hero{position:relative;margin-top:14px;height:210px}
svg{position:absolute;left:-6px;top:0;width:210px;height:210px}
.num{position:absolute;left:0;top:30px;font-size:132px;line-height:1;font-weight:900;letter-spacing:-.05em;color:var(--orange)}
.unit{position:absolute;left:182px;top:114px;font-size:26px;font-weight:800;line-height:1.1}
.unit small{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--mute)}
h1{text-wrap:balance;margin-top:6px;font-size:22px;line-height:1.35;font-weight:800}
.meta{margin-top:10px;font-size:13px;color:var(--mute);font-weight:600}
.recs{margin-top:22px;border-top:1px solid var(--line)}
.recs div{padding:13px 0 13px 30px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.55;position:relative;color:#eadfd0}
.recs div::before{content:"“";position:absolute;left:0;top:6px;font-size:34px;line-height:1;color:var(--orange);font-weight:900}
.recs p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.foot .d{font-size:13px;color:var(--mute);font-weight:600;line-height:1.5}
.foot .w{font-size:22px;font-weight:900;letter-spacing:.06em}
.foot .w i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange);margin-right:8px}
</style></head><body>
<div class="head"><span><b>番茄完成</b>　第 1 个</span><span>今天累计 30 分钟</span></div>
<div class="hero">
  <svg viewBox="0 0 210 210"><circle cx="105" cy="105" r="92" fill="none" stroke="#ffffff14" stroke-width="10"/><circle cx="105" cy="105" r="92" fill="none" stroke="#f2793f" stroke-width="10" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="0" transform="rotate(-90 105 105)" opacity=".9"/></svg>
  <div class="num" style="left:48px;top:42px;font-size:104px">30</div>
  <div class="unit" style="left:150px;top:108px;display:none"></div>
</div>
<h1>阅读第二章《像经济学家一样思考》</h1>
<div class="meta">专注 30 分钟，期间留下 2 条记录</div>
<div class="recs">
  <div><p>这个记录到任务中感觉还是可以借用快捷输入，这样可以通过拍照识别来快速输入</p></div>
  <div><p>在快速输入中也可以增加一个追加的按钮，放在模板按钮的右侧，可以快速追加</p></div>
</div>
<div class="foot"><div class="d">2026 年 10 月 16 日<br>周五 10:46</div><div class="w"><i></i>拾忆</div></div>
</body></html>
