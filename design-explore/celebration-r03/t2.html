<!doctype html>

<title>T2 大数字票</title>
<style>
:root{--bg:#0e0b09;--paper:#fcf9f1;--ink:#1f1610;--mute:#6a5e53;--line:#ddd2c0;--deep:#b2441b;--green:#2f8f5b;--amber:#b25a05}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:392px;overflow:hidden}
body{font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--ink);position:relative;padding-top:34px;
 background:radial-gradient(75% 45% at 50% 48%,#44291a 0,transparent 74%),linear-gradient(#1a1410,#0b0908 80%)}
.notch{-webkit-mask:radial-gradient(circle at 0 7px,#0000 4px,#000 4.5px) left/51% 14px repeat-y,radial-gradient(circle at 100% 7px,#0000 4px,#000 4.5px) right/51% 14px repeat-y;mask:radial-gradient(circle at 0 7px,#0000 4px,#000 4.5px) left/51% 14px repeat-y,radial-gradient(circle at 100% 7px,#0000 4px,#000 4.5px) right/51% 14px repeat-y}
.ticket{position:relative;margin:0 auto;width:342px;background:linear-gradient(var(--paper),#f6f1e4);filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.rec{display:flex;align-items:center;gap:9px;background:#f2ecdf;border-radius:9px;padding:8px 11px;margin-bottom:6px;font-size:13px;line-height:1.3}
.rec i{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--green);position:relative}
.rec i::after{content:"";position:absolute;left:3px;top:0;width:3px;height:6px;border:solid var(--green);border-width:0 2px 2px 0;transform:rotate(40deg)}
.rec p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec u{flex:none;text-decoration:none;font-size:11px;font-weight:800;color:#1f6a40;background:#d9efe0;border-radius:5px;padding:2px 6px}
.sec{margin:12px 0 7px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mute)}
.sec::before,.sec::after{content:"";flex:1;border-top:1px solid var(--line)}
.sn{font:600 9.5px/1.4 "SF Mono",Menlo,"PingFang SC",monospace;color:var(--mute);letter-spacing:.01em;white-space:nowrap}
.bars{display:flex}.bars i{display:block;background:var(--ink)}
.stamp{border-radius:50%;border:2.5px solid var(--deep);color:var(--deep);display:grid;place-items:center;text-align:center;font-weight:900;line-height:1.15;transform:rotate(-12deg);position:relative;mix-blend-mode:multiply;flex:none}
.stamp::before{content:"";position:absolute;inset:3.5px;border:1px dashed var(--deep);border-radius:50%}
.stamp small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;margin-top:2px}
.brand{font:800 14px/1 "SF Mono",Menlo,"PingFang SC",monospace}
.ok{font-size:12px;font-weight:700;color:#1f6a40}.ok::before{content:"● ";font-size:9px}
.ticket{padding:18px 20px 16px;border-radius:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.hero{margin-top:12px;display:flex;align-items:center;gap:14px;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);padding:12px 0}
.big{flex:none;font:900 54px/1 "SF Mono",Menlo,monospace;color:var(--amber);letter-spacing:-.04em}
.big small{display:block;font:700 12px/1 "PingFang SC",sans-serif;letter-spacing:0;color:var(--mute);margin-top:6px;text-align:center}
.side{flex:1;min-width:0}
h1{font-size:16px;line-height:1.38;font-weight:900;text-wrap:balance}
.meta{margin-top:7px;font-size:12px;color:var(--mute);font-weight:600;display:flex;gap:10px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:800}
.foot{margin-top:12px}.foot .bars{height:28px;margin-bottom:5px}
.ticket .stamp{position:absolute;right:16px;bottom:24px;width:52px;height:52px;font-size:12px}
</style></head><body>
<main class="ticket notch"><div class="top"><div class="brand">拾忆 · 专注小票</div><div class="ok">已完成</div></div>
