<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>专注终端 · 精修</title>
<style>
:root{--led:#FFB14A;--paper1:#FCF9F1;--paper2:#F6F1E4;--ink:#1F1610;--mute:#6A5E53;--line:#DDD2C0;--deep:#B2441B;--green:#1F6A40;--num:#B8650A;--tg:#6FDC9A;--tm:#A39382;--edge:#2C241D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;height:460px;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,#c9ced8,#b3bac6);position:relative}
.isl{position:absolute;left:50%;top:0;width:780px;transform:translateX(-50%);background:#000;border-radius:0 0 28px 28px;box-shadow:0 22px 50px -10px rgba(0,0,0,.55);color:#fff;padding:0 14px 14px}
.head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--tm)}
.head .r{display:flex;align-items:center;gap:10px;letter-spacing:0;font-family:-apple-system,"PingFang SC";font-size:12px;font-weight:700;color:var(--tg)}
.head .r i{width:6px;height:6px;border-radius:3px;background:var(--tg)}
.skip{font-size:10.5px;font-weight:600;color:var(--tm);background:rgba(255,255,255,.08);padding:2px 8px;border-radius:10px}
.chassis{display:grid;grid-template-columns:1fr 1px 1fr;background:linear-gradient(180deg,#1F1915,#0E0B09);border:1px solid var(--edge);border-radius:22px;height:292px;overflow:hidden}
.div{background:linear-gradient(180deg,transparent,#3a3028 12%,#3a3028 88%,transparent)}
/* 左 */
.L{padding:12px 0 12px;display:flex;flex-direction:column;align-items:center}
.slot{width:200px;height:6px;border-radius:3px;background:#030202;border:.5px solid #3a3028;box-shadow:0 2px 5px #000;z-index:2}
.ticket{margin-top:-3px;width:310px;padding:16px 20px 14px;background:linear-gradient(180deg,var(--paper1),var(--paper2));color:var(--ink);border-radius:0 0 12px 12px;position:relative;
 -webkit-mask:radial-gradient(circle 4.5px at 0 7px,#0000 98%,#000) left/51% 14px repeat-y,radial-gradient(circle 4.5px at 100% 7px,#0000 98%,#000) right/51% 14px repeat-y;box-shadow:0 5px 12px rgba(0,0,0,.4)}
.th{display:flex;justify-content:space-between}.th b{font:700 13px ui-monospace,Menlo,monospace}.th span{font-size:12px;font-weight:700;color:var(--green)}.th span i{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--green);margin-right:5px}
.main{display:flex;gap:14px;margin-top:10px}.num{text-align:center}.num strong{display:block;font:800 46px/1 ui-rounded,sans-serif;color:var(--num)}.num small{font-size:11px;color:var(--mute)}
.main h4{font-size:15px;margin:3px 0 4px;line-height:1.3}.main p{font-size:10.5px;font-weight:600;color:var(--mute);line-height:1.5}
.dash{border-top:1.2px dashed var(--line);margin:9px 0}.cheer{font-size:11.5px;color:var(--mute);line-height:1.6;padding-right:64px}
.foot{margin-top:10px;padding-right:60px}.bc{height:24px;width:140px;display:block;margin-bottom:4px}.foot small{font:700 8px ui-monospace,Menlo,monospace;color:var(--mute);white-space:nowrap}
.stamp{position:absolute;right:14px;bottom:12px;width:48px;height:48px;border:2.5px solid var(--deep);border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);color:var(--deep);font-weight:700;font-size:11.5px;text-align:center;line-height:1.1}
.stamp::after{content:"";position:absolute;inset:3px;border:1px dashed var(--deep);border-radius:50%}.stamp em{font-style:normal;font-size:8.5px;display:block}
.keys{margin-top:auto;display:flex;gap:6px}
.key{height:26px;padding:0 11px;border-radius:7px;background:linear-gradient(180deg,#38302a,#251f1a);border:1px solid #473d34;box-shadow:0 1.5px 0 #0c0a08;font-size:11.5px;font-weight:600;color:#e8dfd3;display:inline-flex;align-items:center;gap:5px}
.key svg{width:11px;height:11px}.key.q{color:var(--tm)}
/* 右 */
.R{padding:14px 20px 12px;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--tm)}
.read{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;padding-bottom:10px;border-bottom:1px solid #2a231d}
.led{font:900 32px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;color:var(--led);text-shadow:0 0 9px rgba(255,177,74,.45)}
.st{font:600 10.5px ui-monospace,Menlo,monospace;color:#C79A55}
.mv{display:flex;gap:10px;align-items:center;margin-top:12px}
.ic{width:30px;height:30px;border-radius:8px;background:rgba(255,177,74,.13);display:grid;place-items:center}
.mv h5{font-size:15px;font-weight:700;line-height:1.2}.mv small{display:block;font:600 10.5px ui-monospace,Menlo,monospace;color:var(--tm);margin-top:2px}
.steps{margin-top:10px;display:grid;gap:5px;font-size:12px;line-height:1.5;color:#d6cdc0}
.steps div{display:flex;gap:9px}.steps b{font:700 10.5px/18px ui-monospace,Menlo,monospace;color:var(--led);flex:none}
.cta{margin-top:auto;display:flex;gap:6px;align-items:center}
.go{height:26px;padding:0 13px;border-radius:7px;background:linear-gradient(180deg,#ffbe62,#e8903a);border:1px solid #ffd08a;box-shadow:0 1.5px 0 #8a4a14;color:#3A1D0C;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.go svg{width:10px;height:10px}
</style></head><body>
<div class="isl">
 <div class="head"><span>拾忆 × 专注终端</span><span class="r"><i></i>番茄完成 · 5 分钟<span class="skip">跳过休息</span></span></div>
 <div class="chassis">
  <div class="L">
   <div class="slot"></div>
   <div class="ticket">
    <div class="th"><b>拾忆 · 专注小票</b><span><i></i>已完成</span></div>
    <div class="main"><div class="num"><strong>5</strong><small>分钟</small></div><div><h4>再整理一个资料清单，关于十四五规划的</h4><p>第 4 个番茄 &nbsp;记录 0 条 &nbsp;今日累计 2 时 45 分</p></div></div>
    <div class="dash"></div><div class="cheer">先休息一会儿，回来继续发光。</div>
    <div class="foot"><canvas class="bc" id="bc" width="280" height="48"></canvas><small>◆ 已完成番茄 · 10-28 21:04 · 271A90 ◆</small></div>
    <div class="stamp"><div>已完成<em>10·28</em></div></div>
   </div>
   <div class="keys">
    <span class="key"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1v6M3.5 4.8 6 7.3l2.5-2.5M1.5 8.5v1.5h9V8.5"/></svg>保存图片</span>
    <span class="key"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="6.5" height="6.5" rx="1.3"/><path d="M8 4V2.8A1.3 1.3 0 0 0 6.7 1.5H2.8A1.3 1.3 0 0 0 1.5 2.8v3.9A1.3 1.3 0 0 0 2.8 8H4"/></svg>复制</span>
    <span class="key q"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg>收起</span>
   </div>
  </div>
  <div class="div"></div>
  <div class="R">
   <div class="hd"><span>BREAK · 长休息</span><span>MOVE 8/22</span></div>
   <div class="read"><span class="led">00:30</span><span class="st">跟练倒计时 · 待机</span></div>
   <div class="mv"><div class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFB14A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.8L8 14"/></svg></div><div><h5>手指操</h5><small>手腕 · 30 秒</small></div></div>
   <div class="steps"><div><b>01</b>用力握拳 3 秒，再突然张开十指撑到最大</div><div><b>02</b>重复 10 次</div><div><b>03</b>逐根手指轻轻向后掰，每根 2 秒</div></div>
   <div class="cta">
    <span class="go"><svg viewBox="0 0 10 10" fill="currentColor"><path d="M2 1l7 4-7 4z"/></svg>开始跟练</span>
    <span class="key">换一个</span><span class="key">开始休息 15′</span>
   </div>
  </div>
 </div>
</div>
<script>(function(){var c=document.getElementById('bc'),x=c.getContext('2d');x.fillStyle='#1F1610';var s=271,r=function(){s=(s*9301+49297)%233280;return s/233280},p=0;while(p<280){var k=(1+Math.floor(r()*3))*2,g=(1+Math.floor(r()*2.4))*2;x.fillRect(p,0,k,48);p+=k+g}})();</script>
</body></html>
